steps:
# Step 0: List the files from GitHub for debugging
- name: 'gcr.io/cloud-builders/gcloud'
  id: 'List Files'
  entrypoint: 'ls'
  args: ['-la']

# Step 1: Build the container image
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build'
  args: ['build', '--no-cache', '-t', 'gcr.io/heroic-tide-428421-q7/peoples-coin-service:$COMMIT_SHA', '.']

# Step 2: Push the container image to the registry
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push'
  args: ['push', 'gcr.io/heroic-tide-428421-q7/peoples-coin-service:$COMMIT_SHA']

# Step 3: Deploy the new image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: 'Deploy'
  entrypoint: gcloud
  args:
    - 'run'
    - 'deploy'
    - 'peoples-coin-service'
    - '--image=gcr.io/heroic-tide-428421-q7/peoples-coin-service:$COMMIT_SHA'
    - '--region=us-central1'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--add-cloudsql-instances=heroic-tide-428421-q7:us-central1:peoples-coin-cluster-final'
    # Runtime DB_USER, DB_PASS, DB_NAME, and INSTANCE_CONNECTION_NAME settings
    # are managed on the Cloud Run service (prefer Secret Manager bindings).
    # Never place database credentials in source-controlled build arguments.

images:
- 'gcr.io/heroic-tide-428421-q7/peoples-coin-service:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
