name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peoples_coin
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: peoples_coin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U peoples_coin -d peoples_coin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BANKING_STATE_DATABASE_URL: postgresql+psycopg2://peoples_coin:test-only@localhost:5432/peoples_coin_test
      BANKING_AUTO_CREATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q peoples_coin observability_node tests
      - name: Run complete test suite
        run: python -m pytest -q
